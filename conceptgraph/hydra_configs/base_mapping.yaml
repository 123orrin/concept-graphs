defaults:
  - base_paths

make_edges: !!bool False

map_with_button: False # Only map when a specific button on the gamepad is pressed

rotate_image: !!bool True
use_pc_for_depth: !!bool False # Use the published point cloud for depth instead of the depth image
use_spectacular_ai: !!bool False # Use the Spectacular AI model for depth estimation

blur_threshold: 100 # Skips images that are too blurry

min_depth: 0.5 # Minimum depth threshold
max_depth: 2.0 # Maximum depth threshold

use_iou: !!bool True
spatial_sim_type: overlap # "iou", "giou", "overlap"
phys_bias: 0.0
match_method: sep_thresh # "sep_thresh", "sim_sum"
# Only when match_method=="sep_thresh"
prioritize_semantic_sim: !!bool False
semantic_threshold: 0.7
physical_threshold: 0.5
# Only when match_method=="sim_sum"
sim_threshold: 0.9

# For contain_number
use_contain_number: !!bool False
contain_area_thresh: 0.95
contain_mismatch_penalty: 0.5

# Selection criteria on the 2D masks
mask_area_threshold: 25 # mask with pixel area less than this will be skipped
mask_conf_threshold: 0.25 # mask with lower confidence score will be skipped
max_bbox_area_ratio: 0.5 # boxes with larger areas than this will be skipped

min_points_threshold: 16 # projected and sampled pcd with less points will be skipped

# point cloud processing
obj_pcd_max_points: 1000 # Determines the maximum point count for object point clouds; exceeding this triggers downsampling to approx max points. Set to -1 to disable.
downsample_voxel_size: 0.015
dbscan_remove_noise: !!bool True
dbscan_eps: 0.15
dbscan_min_points: 50
# Selection criteria of the fused object point cloud
obj_min_points: 10
obj_min_detections: 5

# For merge_overlap_objects() function
merge_overlap_thresh: 0.7      # -1 means do not perform the merge_overlap_objects()
merge_visual_sim_thresh: 0.8   # Merge only if the visual similarity is larger
merge_text_sim_thresh: 0.7     # Merge only if the text cosine sim is larger

# Periodically perform post-process operations every k frame
# -1 means not perform them during the run. They are performed at the end anyway. 

denoise_interval: 10           # Run DBSCAN every k frame. This operation is heavy
filter_interval: 6            # Filter objects that have too few associations or are too small
merge_interval: 10             # Merge objects based on geometric and semantic similarity
run_denoise_final_frame: !!bool True
run_filter_final_frame: !!bool True
run_merge_final_frame: !!bool True

detection_model: yolov8l-world # "yolov8l-world", "yolov8l-worldv2"
sam_predictor_model: sam2_b # "sam_l", "mobile_sam" (UltraLytics SAM), "sam2_b" (UltraLytics SAM 2 base), "sam2_t" (UltraLytics SAM 2 tiny)